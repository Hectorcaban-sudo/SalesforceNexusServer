# Jaeger v2 configuration
# Binds admin UI, health check, and ingestion receivers to 0.0.0.0
# so they are reachable remotely (not just from localhost).
#
# IMPORTANT: Jaeger has no built-in auth on these ports. Exposing
# 0.0.0.0 to the internet means anyone who can reach the host can
# read traces or submit fake ones. Put this behind a firewall,
# reverse proxy (with auth/TLS), or VPN before opening it publicly.

extensions:
  # Health/liveness check for the whole collector
  health_check:
    endpoint: 0.0.0.0:13133

  # Jaeger UI + query API (this is the "admin" interface)
  jaeger_query:
    storage:
      traces: memory_storage
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685

  # Storage backend - swap "memory" for badger/elasticsearch/cassandra
  # if you need traces to survive a restart
  jaeger_storage:
    backends:
      memory_storage:
        memory:
          max_traces: 100000

receivers:
  # OTLP - the modern standard for apps sending traces/metrics
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Legacy Jaeger client protocols, in case your apps use the
  # older jaeger-client libraries instead of OpenTelemetry SDKs
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory_storage

service:
  extensions: [health_check, jaeger_query, jaeger_storage]
  pipelines:
    traces:
      receivers: [otlp, jaeger]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    metrics:
      level: detailed
      address: 0.0.0.0:8888
